<article class="company" data-src="${root}data/$ticker.json">
  <header class="page-header">
    <p class="eyebrow">$eyebrow</p>
    <h1>$name <span class="ticker">$ticker</span></h1>
    <p class="meta">$status_badge $header_links</p>
  </header>
$key_figures
$model_section
  <section id="reported" class="section">
    <h2>Reported</h2>
    <p class="source">SEC XBRL, calendar periods. Cash-flow quarters derived from year-to-date filings.</p>
    <noscript><p class="source">Charts need JavaScript.</p></noscript>
    <div class="charts" data-charts="reported"></div>
$reported_html
  </section>
$writeups_section
  <script type="application/json" data-company>$inline_json</script>
</article>
